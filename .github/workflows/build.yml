name: Build Madeira OpenGL Branch IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Codex Graphics Branch
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          # Target the exact development branch holding the integrated graphics overhauls
          ref: 'codex/graphics-build-integration'
          submodules: 'recursive'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Compile Integrated IPA
        run: |
          chmod +x ./tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenGL-Madeira-Graphics-Integration-IPA
          path: dist/Madeira.ipa
