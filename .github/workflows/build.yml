name: Build Madeira OpenGL Commit IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Specific Graphics Commit
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          ref: '7ed32a9be9e0729525b80d6bc726cc3a844ffaad'
          submodules: 'recursive'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Brute-Force Code Modification & Compile
        run: |
          # Directly modify the code files to provide a fallback definition if the compiler locks to C++17
          TARGET_FILE_1="FEX/FEXCore/include/FEXCore/Utils/SpinWaitLock.h"
          TARGET_FILE_2="FEX/FEXCore/include/FEXCore/Utils/WritePriorityMutex.h"

          for FILE in "$TARGET_FILE_1" "$TARGET_FILE_2"; do
            if [ -f "$FILE" ]; then
              # Inject a macro at line 1 that maps atomic_ref to a standard atomic pointer wrapper if it's missing
              printf "#include <atomic>\nnamespace std { template<typename T> using atomic_ref = atomic<T>; }\n$(cat "$FILE")" > "$FILE.tmp"
              mv "$FILE.tmp" "$FILE"
              echo "Patched $FILE source code directly."
            fi
          done

          chmod +x ./tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenGL-Madeira-7ed32a9-IPA
          path: dist/Madeira.ipa
