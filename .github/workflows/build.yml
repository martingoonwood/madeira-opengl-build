name: Build Madeira OpenGL Commit IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Specific Graphics Commit
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          ref: '7ed32a9be9e0729525b80d6bc726cc3a844ffaad'
          submodules: 'recursive'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Force Prepend C++20 to FEX & Compile
        run: |
          # Inject C++20 right at the beginning of FEX's build setup
          if [ -f FEX/CMakeLists.txt ]; then
            echo -e "set(CMAKE_CXX_STANDARD 20)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\n$(cat FEX/CMakeLists.txt)" > FEX/CMakeLists.txt
            echo "Successfully injected C++20 into the top of FEX CMakeLists.txt"
          fi

          chmod +x ./tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenGL-Madeira-7ed32a9-IPA
          path: dist/Madeira.ipa
