name: Build Madeira OpenGL Commit IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Specific Graphics Commit
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          ref: '7ed32a9be9e0729525b80d6bc726cc3a844ffaad'
          submodules: 'recursive'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Compile Custom IPA
        env:
          # Sets C++20 strictly for modern submodules like FEX without poisoning the Wine config scripts
          CMAKE_CXX_FLAGS: "-std=c++20"
          CXXFLAGS: "-std=c++20"
        run: |
          chmod +x ./tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenGL-Madeira-7ed32a9-IPA
          path: dist/Madeira.ipa
