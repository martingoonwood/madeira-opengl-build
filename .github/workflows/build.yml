name: Build Madeira OpenGL Commit IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Specific Graphics Commit
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          ref: '7ed32a9be9e0729525b80d6bc726cc3a844ffaad'
          submodules: 'recursive'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Brute-Force Code Patch & Compile
        run: |
          TARGET_FILE_1="FEX/FEXCore/include/FEXCore/Utils/SpinWaitLock.h"
          TARGET_FILE_2="FEX/FEXCore/include/FEXCore/Utils/WritePriorityMutex.h"

          for FILE in "$TARGET_FILE_1" "$TARGET_FILE_2"; do
            if [ -f "$FILE" ]; then
              # Create a clean patch header file using a multi-line heredoc
              cat << 'EOF' > patch_header.h
#pragma once
#include <atomic>
#include <cstdint>
namespace std {
    template<typename T>
    struct atomic_ref {
        T* ptr;
        atomic_ref(T& obj) : ptr(&obj) {}
        T load() const { return *ptr; }
        void store(T val) { *ptr = val; }
        bool compare_exchange_strong(T& expected, T desired) {
            if (*ptr == expected) { *ptr = desired; return true; }
            expected = *ptr; return false;
        }
    };
}
EOF
              # Prepend the patch header to the original source file safely
              cat patch_header.h "$FILE" > "$FILE.tmp"
              mv "$FILE.tmp" "$FILE"
              rm patch_header.h
              echo "Successfully patched $FILE directly."
            fi
          done

          chmod +x ./tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenGL-Madeira-7ed32a9-IPA
          path: dist/Madeira.ipa
