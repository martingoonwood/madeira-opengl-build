name: Build Madeira OpenGL Branch IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Codex Graphics Branch
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          ref: 'codex/graphics-build-integration'
          submodules: 'recursive'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Brute-Force Rewrite Source Files & Compile
        run: |
          # Use Python to directly patch the source code text to inject a C++17 compatible atomic_ref
          python3 -c "
          import os

          files_to_patch = [
              'FEX/FEXCore/include/FEXCore/Utils/SpinWaitLock.h',
              'FEX/FEXCore/include/FEXCore/Utils/WritePriorityMutex.h'
          ]

          patch_code = '''#pragma once
          #include <atomic>
          #include <cstdint>
          namespace std {
              template<typename T>
              struct atomic_ref {
                  T* ptr;
                  atomic_ref(T& obj) : ptr(&obj) {}
                  T load() const { return *ptr; }
                  void store(T val) { *ptr = val; }
                  bool compare_exchange_strong(T& expected, T desired) {
                      if (*ptr == expected) { *ptr = desired; return true; }
                      expected = *ptr; return false;
                  }
              };
          }
          '''

          for file_path in files_to_patch:
              if os.path.exists(file_path):
                  with open(file_path, 'r', errors='ignore') as f:
                      original_content = f.read()
                  
                  # Prepend our custom type layer right to line 1 of the file
                  with open(file_path, 'w') as f:
                      f.write(patch_code + '\n' + original_content)
                  print(f'Systematically patched source file: {file_path}')
          "

          chmod +x ./tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenGL-Madeira-Graphics-Integration-IPA
          path: dist/Madeira.ipa
