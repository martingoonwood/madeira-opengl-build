name: Build Madeira OpenGL Commit IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Specific Graphics Commit
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          ref: '7ed32a9be9e0729525b80d6bc726cc3a844ffaad'
          submodules: 'recursive'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Overwrite All Hardcoded FEX C++ Standards & Compile
        run: |
          # Recursively find every CMakeLists.txt file inside FEX and swap 17 for 20 standard declarations
          find FEX -name "CMakeLists.txt" -type f -exec sed -i '' 's/cxx_std_17/cxx_std_20/g' {} +
          find FEX -name "CMakeLists.txt" -type f -exec sed -i '' 's/CXX_STANDARD 17/CXX_STANDARD 20/g' {} +
          find FEX -name "CMakeLists.txt" -type f -exec sed -i '' 's/set(CMAKE_CXX_STANDARD 17)/set(CMAKE_CXX_STANDARD 20)/g' {} +
          
          echo "All internal FEX target properties systematically upgraded to C++20."

          chmod +x ./tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenGL-Madeira-7ed32a9-IPA
          path: dist/Madeira.ipa
